<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bài 2 - Máy tính JavaScript</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🧮 Máy tính đơn giản</h1>
    <p class="subtitle">Bài tập thực hành 2 - JavaScript cơ bản</p>
    <nav><a href="../index.html">← Về trang chủ</a></nav>
  </header>

  <main>
    <div class="calculator">
      <!-- Màn hình hiển thị -->
      <div class="screen">
        <div id="expression" class="expression"></div>
        <div id="display" class="display">0</div>
      </div>

      <!-- Bàn phím: dùng data-* để JS biết từng nút làm gì -->
      <div class="keys">
        <button class="key key-action" data-action="clear">C</button>
        <button class="key key-action" data-action="delete">⌫</button>
        <button class="key key-op" data-operator="%">%</button>
        <button class="key key-op" data-operator="/">÷</button>

        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key" data-number="9">9</button>
        <button class="key key-op" data-operator="*">×</button>

        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>
        <button class="key key-op" data-operator="-">−</button>

        <button class="key" data-number="1">1</button>
        <button class="key" data-number="2">2</button>
        <button class="key" data-number="3">3</button>
        <button class="key key-op" data-operator="+">+</button>

        <button class="key key-wide" data-number="0">0</button>
        <button class="key" data-number=".">,</button>
        <button class="key key-equal" data-action="equals">=</button>
      </div>
    </div>

    <p class="hint">
      Mẹo: bạn có thể gõ trực tiếp bằng bàn phím máy tính
      (số, <code>+ - * / %</code>, <code>Enter</code> = tính, <code>Esc</code> = xoá).
    </p>
  </main>

  <footer>
    <p>&copy; 2025 - Hoàng Ngọc Quyền - B25DCCC189</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
